<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMind - Inicio de Sesión</title>
    <link rel="stylesheet" href="Estilos/Global.css">
    <link rel="stylesheet" href="Estilos/Login.css">
</head>
<body>

    <div class="pantalla-dividida">
        <div class="tarjeta-contenedor">
            
            <div class="panel-formulario">
                <a href="Inicio.html" class="btn-volver"> <i class="bi bi-arrow-left-short"></i> Volver </a>
                <div class="registro-header">
                    <img src="Img/Capa 1.svg" alt="StockMind" class="logo-stockmind">
                    <h1>Inicia Sesión</h1>
                </div>

                <form action="#">
                    <div class="grupo-input input-con-icono">
                        <i class="bi bi-envelope"></i> <input type="email" placeholder="Correo Electrónico" required>
                    </div>

                    <div class="grupo-input input-con-icono">
                        <i class="bi bi-lock"></i> <input type="password" placeholder="Contraseña" required>
                    </div>

                    <div class="link-olvido">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-registrar">INICIAR SESIÓN</button>
                </form>
            </div>

            <div class="panel-lateral login-verde">
                <div class="contenido-lateral">
                    <h2>¡Bienvenido a StockMind!</h2>
                    <p>Ingresa tus datos personales y comienza tu jornada con nosotros.</p>
                    <a href="RegistroPaso01.html" class="btn-outline">REGISTRARSE</a>
                    <div class="logo-sena">
                        <img src="Img/SENAblanco.svg" alt="SENA" class="logo-sena-blanco">
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
